<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPOCH Lab</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image-container">
        <div class="hero">
            <div class="social-links">
                <a href="https://github.com/epochlab" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">&#9679;</a>
                <a href="https://www.linkedin.com/in/jroberts86/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">&#9679;</a>
                <a href="mailto:jroberts86@gmail.com" aria-label="Email" title="Email">&#9679;</a>
            </div>
            <img src="images/sample.webp" alt="EPOCH Lab" fetchpriority="high">
            <ul id="articles"></ul>
        </div>
    </div>
    <script>
        fetch('articles.json')
            .then(r => r.json())
            .then(articles => {
                const ul = document.getElementById('articles');

                ul.innerHTML = articles
                    .map(a => `<li><a href="article.html?id=${a.title}" title="${a.title}">${a.id}</a></li>`)
                    .join('');
            })
            .catch(() => {});
    </script>
</body>
</html>
