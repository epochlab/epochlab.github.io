<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPOCH Lab</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preload" href="fonts/inconsolata.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="article.css">
</head>
<body>
    <div id="content"></div>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        const content = document.getElementById('content');
        const home = '<a href="index.html" aria-label="Home">&#8962;</a>';

        fetch('articles.json')
            .then(r => r.json())
            .then(articles => {
                const i = articles.findIndex(a => a.title === id);
                if (i < 0) {
                    content.innerHTML = `<p>${home} not found</p>`;
                    return;
                }
                const article = articles[i];
                document.title = `EPOCH Lab | ${article.title}`;
                const media = article.media_type === 'video'
                    ? `<iframe src="${article.media_url}" title="${article.title}" allowfullscreen></iframe>`
                    : `<img src="${article.media_url}" alt="">`;
                const neighbours = [articles[(i - 1 + articles.length) % articles.length], articles[(i + 1) % articles.length]];
                const [prev, next] = neighbours.map(a => `article.html?id=${a.title}`);
                const nav = `<span><a href="${prev}" aria-label="Previous">&lt;</a> <a href="${next}" aria-label="Next">&gt;</a></span>`;
                document.addEventListener('keydown', e => {
                    if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return;
                    if (e.key === 'ArrowLeft') location.href = prev;
                    else if (e.key === 'ArrowRight') location.href = next;
                });
                let x0, y0;
                document.addEventListener('touchstart', e => {
                    if (e.touches.length === 1) [x0, y0] = [e.touches[0].clientX, e.touches[0].clientY];
                    else x0 = undefined;
                }, { passive: true });
                document.addEventListener('touchend', e => {
                    if (x0 === undefined || visualViewport.scale > 1) return;
                    const dx = e.changedTouches[0].clientX - x0;
                    const dy = e.changedTouches[0].clientY - y0;
                    if (Math.abs(dx) > 50 && Math.abs(dx) > 2 * Math.abs(dy)) location.href = dx < 0 ? next : prev;
                });
                content.innerHTML = `<p class="header"><span>${home} : ${article.date} :: ${article.title}</span>${nav}</p><p>${media}</p><p class="caption"><b>${article.id}. ${article.caption.title}.</b> ${article.caption.text}</p>`;
                for (const a of neighbours) if (a.media_type === 'image') Object.assign(new Image(), { fetchPriority: 'low', src: a.media_url });
            })
            .catch(() => {
                content.innerHTML = `<p>${home} failed to load</p>`;
            });
    </script>
</body>
</html>
