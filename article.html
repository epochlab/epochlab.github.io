<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPOCH Lab</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap">
    <link rel="stylesheet" href="article.css">
</head>
<body>
    <div id="content"></div>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const content = document.getElementById('content');

        fetch('articles.json')
            .then(r => r.json())
            .then(articles => {
                const i = articles.findIndex(a => a.title === id);
                if (i < 0) {
                    content.innerHTML = '<p><a href="index.html" aria-label="Home">&#8962;</a> not found</p>';
                    return;
                }
                const article = articles[i];
                document.title = `EPOCH Lab | ${article.title}`;
                const media = article.media_type === 'video'
                    ? `<iframe src="${article.media_url}" title="${article.title}" allowfullscreen></iframe>`
                    : `<img src="${article.media_url}" alt="${article.title}">`;
                const prev = articles[(i - 1 + articles.length) % articles.length];
                const next = articles[(i + 1) % articles.length];
                const nav = `<span><a href="article.html?id=${prev.title}" aria-label="Previous">&lt;</a> <a href="article.html?id=${next.title}" aria-label="Next">&gt;</a></span>`;
                content.innerHTML = `<p class="header"><span><a href="index.html" aria-label="Home">&#8962;</a> : ${article.date} :: ${article.title}</span>${nav}</p><p>${media}</p><p class="caption"><b>${article.id}. ${article.caption.title}.</b> ${article.caption.text}</p>`;
            })
            .catch(() => {
                content.innerHTML = '<p><a href="index.html" aria-label="Home">&#8962;</a> failed to load</p>';
            });
    </script>
</body>
</html>
